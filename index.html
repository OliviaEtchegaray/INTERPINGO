<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Organizador de Evento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fondos solicitados */
        .bg-inicio {
            background-color: #5C1C7E;
            background-image: url('fondovioleta.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            width: 100%;
        }

        .bg-seccion {
            background-color: #A6FE0C;
            background-image: url('fondoverde.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            width: 100%;
        }

        /* Animaciones */
        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .animate-zoom-in { animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-slide-up { opacity: 0; animation: slideUp 0.5s ease-out forwards; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }

        /* Fallbacks hermosos si las imágenes no cargan */
        img { color: transparent; position: relative; }
        
        .image-failed {
            background: linear-gradient(145deg, #1f2937, #111827);
            color: #A6FE0C !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 900;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid rgba(166, 254, 12, 0.3);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            min-height: 100px;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #titulo-img.image-failed {
            font-size: 2.5rem;
            background: transparent;
            border: none;
            box-shadow: none;
            color: white !important;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 2rem;
            height: 2rem;
            border: 3px solid #cbd5e1;
            border-radius: 0.5rem;
            background-color: rgba(0, 0, 0, 0.2);
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }

        .custom-checkbox::before {
            content: "";
            width: 1.2rem;
            height: 1.2rem;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: #A6FE0C;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #A6FE0C;
        }

        .custom-checkbox:checked {
            border-color: #A6FE0C;
            background-color: rgba(166, 254, 12, 0.1);
        }

        .custom-checkbox:checked::before { transform: scale(1); }

        /* Fila de tarea */
        .task-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        
        .task-row:active { transform: scale(0.98); }
        
        .task-row.completed p {
            text-decoration: line-through;
            color: #6b7280; /* Gris apagado */
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- VISTA INICIO -->
    <div id="pantalla-inicio" class="bg-inicio flex flex-col items-center pt-12 pb-12 px-6 relative">
        <div class="w-full max-w-sm mb-12 mt-4">
            <img src="titulo.png" alt="EVENTO" id="titulo-img" 
                 class="w-full h-32 object-contain animate-zoom-in drop-shadow-2xl"
                 onerror="window.handleImageError(this)">
        </div>

        <div class="grid grid-cols-1 gap-5 w-full max-w-sm">
            <button onclick="nav('cronograma')" class="w-full focus:outline-none transform active:scale-95 transition-transform">
                <img src="cronograma.png" alt="CRONOGRAMA" class="w-full h-24 object-contain animate-slide-up delay-100" onerror="window.handleImageError(this)">
            </button>
            <button onclick="nav('tareas')" class="w-full focus:outline-none transform active:scale-95 transition-transform">
                <img src="tareas.png" alt="TAREAS" class="w-full h-24 object-contain animate-slide-up delay-200" onerror="window.handleImageError(this)">
            </button>
            <button onclick="nav('bandas')" class="w-full focus:outline-none transform active:scale-95 transition-transform">
                <img src="bandas.png" alt="BANDAS" class="w-full h-24 object-contain animate-slide-up delay-300" onerror="window.handleImageError(this)">
            </button>
            <button onclick="nav('feria')" class="w-full focus:outline-none transform active:scale-95 transition-transform">
                <img src="feria.png" alt="FERIA" class="w-full h-24 object-contain animate-slide-up delay-400" onerror="window.handleImageError(this)">
            </button>
            <button onclick="nav('expo')" class="w-full focus:outline-none transform active:scale-95 transition-transform">
                <img src="expo.png" alt="EXPO" class="w-full h-24 object-contain animate-slide-up delay-500" onerror="window.handleImageError(this)">
            </button>
            <button onclick="nav('graff')" class="w-full focus:outline-none transform active:scale-95 transition-transform">
                <img src="graff.png" alt="GRAFF" class="w-full h-24 object-contain animate-slide-up delay-600" onerror="window.handleImageError(this)">
            </button>
        </div>
    </div>

    <!-- VISTA SECCIÓN -->
    <div id="pantalla-seccion" class="bg-seccion hidden flex-col relative pb-20 pt-20">
        <!-- Botón Volver (Flecha Flotante Exacta) -->
        <div class="fixed top-4 left-4 z-50">
            <button onclick="nav('inicio')" class="focus:outline-none transform active:scale-90 transition-transform p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="#A6FE0C" style="filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.9)) drop-shadow(0px 0px 3px rgba(0,0,0,1)); stroke-width: 3.5;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button>
        </div>

        <div id="seccion-contenido" class="p-4 w-full max-w-2xl mx-auto flex-grow mt-4">
            <!-- El contenido de las listas se inyecta aquí con JS -->
        </div>
        
        <!-- Estado de Sincronización -->
        <div id="sync-status" class="fixed bottom-2 right-2 text-[10px] font-bold text-white bg-black/70 px-2 py-1 rounded">
            Conectando...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Fallback de imágenes
        window.handleImageError = function(img) {
            img.onerror = null;
            const fallbackDiv = document.createElement('div');
            fallbackDiv.className = img.className + ' image-failed';
            fallbackDiv.innerText = img.alt;
            img.parentNode.replaceChild(fallbackDiv, img);
        };

        const EVENT_DATA = {
            cronograma: { type: 'imageOnly', src: 'crono.png', alt: 'CRONOGRAMA' },
            tareas: {
                type: 'grouped',
                groups: [
                    { id: 'abril', image: 'abril.png', alt: 'ABRIL', tasks: ['TELA', 'STICKERS', 'LUCES ROSAS', 'ZAPATILLA', 'CINTA', 'TANZA', 'COMPU', 'HDMI', 'CARGADOR'] },
                    { id: 'oli', image: 'oli.png', alt: 'OLI', tasks: ['CAMARA CON MEMORIA Y BATERIA', 'VIDEOCAMARA1', 'VIDEOCAMARA2', 'LUZ CAMARA', 'LUZ ROJA', 'LUZ INDIVIDUAL', 'SOPORTE', 'HDMI', 'ADAPTADOR', 'ZAPATILLA', 'ROPASUPLICIA'] },
                    { id: 'zeki', image: 'zeki.png', alt: 'ZEKI', tasks: ['TELEVISORES', 'EXPO', 'TIJERA', 'TANZ', 'ZAPATILLA'] },
                    { id: 'ari', image: 'ari.png', alt: 'ARI', tasks: ['IMPRESION'] }
                ]
            },
            bandas: {
                type: 'grouped',
                groups: [
                    { id: 'suplicia', image: 'suplicia.png', alt: 'SUPLICIA', tasks: ['PRUEBA DE SONIDO', 'CABLES', 'VESTIMENTA', 'VOZ', 'BAJO', 'GUITARRA', 'GUITARRA', 'BATA'] },
                    { id: 'crisis', image: 'crisis.png', alt: 'CRISIS', tasks: ['TRAJO BATA', 'PRUEBA DE SONIDO', 'VOZ', 'GUITARRA', 'BAJO', 'BATA'] },
                    { id: 'rodo', image: 'rodo.png', alt: 'RODO', tasks: ['PIE DE MIC', 'GUITARRA', 'VOZ1', 'VOZ2', 'VOZ3', 'GUITARRA', 'BAJO', 'BATA', 'TECLADO'] },
                    { id: 'sonido', image: 'sonido.png', alt: 'SONIDO', tasks: ['CABLES', 'CONSOLA', 'PARLANTES GRANDES', 'PARLANTE RETORNO'] }
                ]
            },
            expo: { type: 'single', tasks: ['MONTAJE SANTI', 'MONTAJE ZEKI', 'MONTAJE 9NUEVE', 'MONTAJE AGUSTINTA'] },
            feria: { type: 'single', tasks: ['MONTAJE DRAMATIZA', 'MONTAJE TRINA', 'MONTAJE GORDOPILCHA', 'MONTAJE TELA MUTA'] },
            graff: { type: 'single', tasks: ['MONTAJE SORPOTE', 'APARICION JUANA', 'LATAS'] }
        };

        // Generador de IDs seguros para Firebase (sin espacios ni caracteres raros)
        const safeId = (str) => {
            // Reemplaza acentos y caracteres especiales
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '_');
        };
        
        const getFirebaseId = (section, group, task) => {
            return `chk_${safeId(section)}_${safeId(group || 'list')}_${safeId(task)}`.substring(0, 100); // Max 100 chars
        };

        const refInicio = document.getElementById('pantalla-inicio');
        const refSeccion = document.getElementById('pantalla-seccion');
        const refContenido = document.getElementById('seccion-contenido');
        
        // Estado local de tareas
        let localTasks = {};

        window.nav = (sectionId) => {
            window.scrollTo(0, 0);
            if (sectionId === 'inicio') {
                refInicio.classList.remove('hidden');
                refInicio.classList.add('flex');
                refSeccion.classList.add('hidden');
                refSeccion.classList.remove('flex');
            } else {
                renderSection(sectionId);
                refInicio.classList.add('hidden');
                refInicio.classList.remove('flex');
                refSeccion.classList.remove('hidden');
                refSeccion.classList.add('flex');
            }
        };

        const renderTaskHtml = (taskId, taskName) => `
            <label class="task-row" id="row-${taskId}" for="${taskId}">
                <input type="checkbox" id="${taskId}" class="custom-checkbox" 
                       onchange="window.toggleTask('${taskId}', this.checked)">
                <p class="text-base font-bold flex-1 select-none leading-tight tracking-wide">${taskName}</p>
            </label>
        `;

        const renderSection = (sectionId) => {
            const data = EVENT_DATA[sectionId];
            if (!data) return;

            let html = '';
            
            if (data.type === 'imageOnly') {
                html = `<img src="${data.src}" alt="${data.alt}" class="w-full h-auto object-contain rounded-xl shadow-2xl mt-4 border-4 border-black/50" onerror="window.handleImageError(this)">`;
            } 
            else if (data.type === 'grouped') {
                data.groups.forEach(group => {
                    html += `
                    <div class="mb-10 bg-black/80 p-5 rounded-3xl shadow-2xl border border-white/20">
                        <div class="mb-6 flex justify-center">
                            <img src="${group.image}" alt="${group.alt}" class="w-full max-w-[200px] h-24 object-contain" onerror="window.handleImageError(this)">
                        </div>
                        <div class="flex flex-col">`;
                    
                    group.tasks.forEach(task => {
                        const taskId = getFirebaseId(sectionId, group.id, task);
                        html += renderTaskHtml(taskId, task);
                    });
                    
                    html += `</div></div>`;
                });
            }
            else if (data.type === 'single') {
                html = `<div class="bg-black/80 p-5 rounded-3xl shadow-2xl border border-white/20 mt-4"><div class="flex flex-col">`;
                data.tasks.forEach(task => {
                    const taskId = getFirebaseId(sectionId, 'list', task);
                    html += renderTaskHtml(taskId, task);
                });
                html += `</div></div>`;
            }

            refContenido.innerHTML = html;
            
            // Aplicar el estado actual a los nuevos elementos del DOM
            Object.keys(localTasks).forEach(id => {
                window.updateUITaskState(id, localTasks[id]);
            });
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'event-org-app';
        let firebaseConfig = { projectId: "mock", apiKey: "mock" }; // Fallback seguro
        if (typeof __firebase_config !== 'undefined') {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) {}
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let globalDocRef = null;
        const statusEl = document.getElementById('sync-status');

        window.updateUITaskState = (taskId, isChecked) => {
            localTasks[taskId] = isChecked;
            const checkbox = document.getElementById(taskId);
            const row = document.getElementById(`row-${taskId}`);
            
            if (checkbox) checkbox.checked = isChecked;
            if (row) {
                if (isChecked) row.classList.add('completed');
                else row.classList.remove('completed');
            }
        };

        window.toggleTask = async (taskId, isChecked) => {
            // Actualización optimista (inmediata en la pantalla)
            window.updateUITaskState(taskId, isChecked);

            if (!globalDocRef || !auth.currentUser) return;
            
            try {
                // Guarda en un ÚNICO documento global para que todos vean exactamente lo mismo al instante
                await setDoc(globalDocRef, { [taskId]: isChecked }, { merge: true });
            } catch (error) {
                console.error("Error guardando:", error);
                // Si falla, revertimos el estado
                window.updateUITaskState(taskId, !isChecked);
            }
        };

        const startFirebaseSync = async () => {
            try {
                // 1. Autenticación silenciosa antes de conectar
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                if (!auth.currentUser) throw new Error("No hay usuario");

                // 2. Ruta estricta para datos compartidos (Un único documento central)
                globalDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'evento_organizador', 'estado_general');

                // 3. Listener directo de Firebase al documento completo
                onSnapshot(globalDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        // Iteramos sobre todas las tareas guardadas y las aplicamos
                        Object.keys(data).forEach(taskId => {
                            const isCompleted = data[taskId] === true; // Nos aseguramos que sea booleano
                            window.updateUITaskState(taskId, isCompleted);
                        });
                    }
                    
                    statusEl.innerText = "Sincronizado ✓";
                    statusEl.classList.remove('text-yellow-400', 'text-red-400');
                    statusEl.classList.add('text-green-400');
                    
                }, (error) => {
                    console.error("Error de conexión:", error);
                    statusEl.innerText = "Desconectado";
                    statusEl.classList.add('text-red-400');
                });

            } catch (error) {
                console.error("Fallo la inicialización de Firebase", error);
                statusEl.innerText = "Modo Local";
                statusEl.classList.add('text-yellow-400');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            startFirebaseSync();
        });

    </script>
</body>
</html>
